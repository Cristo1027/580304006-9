name: .NET Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore GestionITM/GestionITM.sln

    - name: Build
      run: dotnet build GestionITM/GestionITM.sln --no-restore

    - name: Test
      run: dotnet test GestionITM/GestionITM.sln --no-build --verbosity normal