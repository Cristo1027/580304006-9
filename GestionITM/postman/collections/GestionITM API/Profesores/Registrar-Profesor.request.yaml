$kind: http-request
name: Registrar Profesor
method: POST
url: '{{baseUrl}}/api/profesor'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Juan Pérez",
      "especialidad": "Matemáticas",
      "email": "juan.perez@itm.edu.co"
    }
examples: './.resources/Registrar-Profesor.resources/examples'
