$kind: http-example
name: 400 Bad Request
request:
  url: '{{baseUrl}}/api/profesor'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: text
    content: 'No se pudo registrar el profesor. Verifique que la especialidad no sea vacía.'
