$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "estudiante@correo.itm.edu.co",
      "password": "123456",
      "rol": "Estudiante"
    }
examples: './.resources/Login.resources/examples'
